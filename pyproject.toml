[project]
name = "gta-clip-command"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.1",
    "av>=11,<19",
    "soundfile>=0.12.1",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0.80",
    "scenedetect[opencv]>=0.6.3",
    "pillow>=10.2.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
]

[tool.vercel]
entrypoint = "src.dashboard:app"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
